<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Scheduler — Legal & App Information</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #e6e8ec;
      --muted: #9aa1ae;
      --accent: #fe2c55;
      --border: #262b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px;
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: var(--muted); }
    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    a.btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
    }
    a.btn.secondary {
      background: #262b36;
      color: var(--text);
    }
    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Personal Content Scheduler</h1>
    <p>
      An automated content publishing and scheduling tool designed to upload and manage
      ready-made short-form videos on TikTok using the official TikTok Content Posting API.
    </p>
    <div class="links">
      <a class="btn" href="./terms.html">Terms of Service</a>
      <a class="btn secondary" href="./privacy.html">Privacy Policy</a>
    </div>
    <footer>
      Last updated: November 16, 2026
    </footer>
  </main>
</body>
</html>
